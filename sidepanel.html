<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关注清理助手</title><link rel="stylesheet" href="sidepanel.css">
<header><small>本机工作区</small><h1>关注清理助手</h1><b id="site">正在识别当前页…</b></header>
<main>
<section><h2>01　筛选规则</h2><fieldset id="settings">
<label>匹配方式 <select id="mode"><option value="any">满足任一条件</option><option value="all">满足全部条件</option></select></label>
<div id="conditions"></div><button id="add">＋ 添加条件</button>
<details><summary>导入自定义 JSON 规则</summary><input type="file" id="file" accept=".json,application/json"><p id="imported"></p><button id="reset">恢复表单规则</button></details>
</fieldset><button class="primary" id="scan">确认规则，开始扫描</button><p id="scanInfo" role="status"></p></section>
<section><h2>02　逐个复核</h2><p>点选账号标红，再点取消。只有标红的账号会进入取关队列。</p><button id="txt" disabled>导出已读名单 TXT</button>
<p id="summary"></p><div id="rows"></div><div id="pages"><button id="prev">上一页</button> <span id="page"></span> <button id="next">下一页</button></div></section>
<section><h2>03　执行与反馈</h2><button id="review" disabled>复核标红名单</button>
<div id="finalBox" hidden><p id="question"></p><button id="go" class="danger">确认取关</button> <button id="back">返回复核</button></div>
<p id="progress" role="status"></p><button id="pause" disabled>暂停</button> <button id="stop" disabled>停止任务</button>
<details id="queueDetails"><summary>逐项状态</summary><ol id="log"></ol></details></section></main>
<script src="rules.js"></script><script src="bili-sign.js"></script><script src="panel-data.js"></script><script src="sidepanel.js"></script></html>
